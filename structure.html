<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rule-Based Person Counter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      max-width: 460px;
      margin: 24px auto;
      padding: 16px;
      background: #f4f6f8;
      color: #1e293b;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      border: 1px solid #e2e8f0;
    }
    h2 { margin: 0 0 14px; font-size: 20px; }
    .cap-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .cap-row input {
      width: 72px;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    .btn-set {
      padding: 6px 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .box small { color: #64748b; }
    .box strong { display: block; font-size: 22px; margin-top: 4px; }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .actions button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
    }
    .in { background: #16a34a; }
    .out { background: #dc2626; }
    .reset { background: #475569; }
    .logs {
      max-height: 160px;
      overflow-y: auto;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
    }
    .logs div {
      padding: 4px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .logs div:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Person Counter</h2>

    <div class="cap-row">
      <label for="maxCap">Max Capacity:</label>
      <input type="number" id="maxCap" value="5" min="1" />
      <button class="btn-set" onclick="updateCapacity()">Update</button>
    </div>

    <div id="statusBox" class="status">Status: Connecting...</div>

    <div class="grid">
      <div class="box"><small>Current Inside</small><strong id="currentCount">0</strong></div>
      <div class="box"><small>Capacity</small><strong id="capView">0 / 5</strong></div>
      <div class="box"><small>Total Entered</small><strong id="totalIn">0</strong></div>
      <div class="box"><small>Total Exited</small><strong id="totalOut">0</strong></div>
    </div>

    <div class="actions">
      <button class="in" onclick="sendAction('entry')">Entry (+1)</button>
      <button class="out" onclick="sendAction('exit')">Exit (-1)</button>
      <button class="reset" onclick="sendAction('reset')">Reset</button>
    </div>

    <div class="logs" id="logBox"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
